ServerRoot "/usr/local/apache2"
Listen 8080
Listen 8443

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule env_module modules/mod_env.so
LoadModule headers_module modules/mod_headers.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule version_module modules/mod_version.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so 
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule alias_module modules/mod_alias.so
LoadModule rewrite_module modules/mod_rewrite.so

# MODULI PER LOAD BALANCING
LoadModule proxy_balancer_module modules/mod_proxy_balancer.so
LoadModule lbmethod_byrequests_module modules/mod_lbmethod_byrequests.so
LoadModule slotmem_shm_module modules/mod_slotmem_shm.so
LoadModule reqtimeout_module modules/mod_reqtimeout.so

<IfModule mpm_event_module>
    StartServers             3
    MinSpareThreads         75
    MaxSpareThreads        250
    ThreadsPerChild         25
    MaxRequestWorkers      400
    MaxConnectionsPerChild   0
</IfModule>

LimitRequestBody 10485760
LimitRequestFields 100
LimitRequestFieldSize 8190

User daemon
Group daemon

ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Mitigazione Anti-DoS Globale
Timeout 60
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5

SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
SSLCipherSuite HIGH:!aNULL:!MD5:!3DES
SSLHonorCipherOrder on
SSLSessionCache "shmcb:/usr/local/apache2/logs/ssl_scache(512000)"
SSLSessionCacheTimeout  300

# Blocca connessioni troppo lente (Slow Loris Attack)
<IfModule reqtimeout_module>
  RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500
</IfModule>

# REDIRECT HTTP -> HTTPS
<VirtualHost *:8080>
    ServerName localhost
    Redirect permanent / https://localhost/
</VirtualHost>

# SERVER HTTPS (SSL Termination)
<VirtualHost *:8443>
    ServerName localhost

    # 1. Crittografia
    SSLEngine on
    SSLCertificateFile "/usr/local/apache2/conf/certs/certificato.pem"
    SSLCertificateKeyFile "/usr/local/apache2/conf/certs/chiave_privata.pem"

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyAddHeaders On
    SSLProxyEngine on

    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://localhost:8443 wss://localhost; img-src 'self' data:; font-src 'self' data:; frame-src 'self' https://localhost:8443; frame-ancestors 'self' https://localhost:8443;"

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    RequestHeader set X-Forwarded-Host "localhost"
    RequestHeader set X-Forwarded-Server "localhost"
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"

    # LOAD BALANCER (API)
    <Proxy "balancer://mycluster">
        BalancerMember "http://api:3001" retry=30 timeout=5
        ProxySet lbmethod=byrequests
    </Proxy>

    # WEBSOCKET REACT
    <Location "/ws">
        ProxyPass ws://web:3000/ws
        ProxyPassReverse ws://web:3000/ws
    </Location>

    # KEYCLOAK
    <Location "/auth">
        ProxyPass http://keycloak:8080/auth retry=0
        ProxyPassReverse http://keycloak:8080/auth
    </Location>

    # API
    <Location "/api">
        ProxyPass "balancer://mycluster/api"
        ProxyPassReverse "balancer://mycluster/api"
    </Location>

    # FRONTEND
    ProxyPass /auth !
    ProxyPass /api !
    ProxyPass /ws !

    ProxyPass / http://web:3000/
    ProxyPassReverse / http://web:3000/

</VirtualHost>